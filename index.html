<style>
/* Layout: one phone column, sticky month-free header, fixed bottom tabs, full-screen add sheet. */

<script>
(() => {
/* ---------- state ---------- */
const DEFAULTS = {
  startDate: todayStr(),
  accounts: [{name:"Bank",open:0,corr:0},{name:"Cash",open:0,corr:0},{name:"NayaPay",open:0,corr:0}],
  defaults: {spent:"Bank", received:"Bank", saveFrom:"Bank", saveTo:"NayaPay"},

  categories: ["Food","Eating Out","Foodpanda","Bills","Fuel & Transport","Rent","Subscriptions","Shopping","Health","Gym","Home","Personal care","Family","Sent to people","Charity","Mobile & phone","Bank fees","Online & card payments","Unknown / check later","Untracked money","Other"],

  limits: {},

};
const PHONE = !!window.__PHONE__;
let fresh = false, setup = {step:0}, openSecs = new Set();
let S = clone(DEFAULTS), E = [], ready = {profile:false, entries:false};
let db = null, uid = null, profileRef = null, entriesCol = null, downloads = null, canWrite = true;
let searchQ = "", showAmt = false; /* balances start hidden every time the app opens */
let frontCard = ""; try{ frontCard=localStorage.getItem("mm.card")||""; }catch(e){}
let tab = "home", monthKey = ym(todayStr()), sheet = null, unlocked = "", openCat = "";
try { unlocked = sessionStorage.getItem("mm.unlock") || ""; } catch (e) {}
try { const t = localStorage.getItem("mm.tab"); if (t) tab = t; } catch (e) {}

/* ---------- helpers ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return (n<10?"0":"")+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ym(s){ return s.slice(0,7); }
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthName(k){ const [y,m]=k.split("-").map(Number); return MON[m-1]+" "+y; }
function shortDate(s){ const [y,m,d]=s.split("-").map(Number); return d+" "+MON[m-1].slice(0,3); }
function addMonths(k,n){ let [y,m]=k.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+pad(m); }
function rs(n){ const v=Math.round(n||0); return (v<0?"−":"")+"Rs "+Math.abs(v).toLocaleString("en-IN"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseAmount(t){
  const m=String(t||"").toLowerCase().replace(/rs\.?/g,"").match(/(-?[\d,]*\.?\d+)\s*(k|lac|lacs|lakh|lakhs)?/);
  if(!m) return NaN; let v=parseFloat(m[1].replace(/,/g,"")); if(m[2]==="k") v*=1000; else if(m[2]) v*=100000; return Math.round(v*100)/100;
}
/* ---------- Face ID (passkey on this device only; nothing leaves the phone) ---------- */
function canFace(){ return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); }
function faceId(){ try{ return localStorage.getItem("mm.faceid")||""; }catch(e){ return ""; } }
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(t){ return Uint8Array.from(atob(t),c=>c.charCodeAt(0)); }
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function faceSetup(){
  if(!canFace()){ toast("Face ID isn't available here"); return; }
  try{ const c=await navigator.credentials.create({publicKey:{rp:{name:"Kifaya",id:location.hostname}, user:{id:rnd(16),name:"Kifaya",displayName:"Kifaya"}, challenge:rnd(32),
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}], authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"}, timeout:60000, attestation:"none"}});
    if(!c) throw 0; try{ localStorage.setItem("mm.faceid",b64(c.rawId)); }catch(e){} render(); toast("Face ID is on. Next time, tap Unlock with Face ID."); }
  catch(x){ toast("Face ID wasn't turned on. Try again."); }
}
async function faceUnlock(){
  const id=faceId(); if(!id||!canFace()) return;
  const err=document.getElementById("pinErr");
  try{ const a=await navigator.credentials.get({publicKey:{challenge:rnd(32), rpId:location.hostname, allowCredentials:[{type:"public-key",id:unb64(id)}], userVerification:"required", timeout:60000}});
    if(a && a.response && (a.response.authenticatorData||a.response.signature)){ unlocked=S.pinHash; try{sessionStorage.setItem("mm.unlock",unlocked);}catch(e){} render(); return; }
    throw 0; }
  catch(x){ if(err) err.textContent="Face ID didn't work. Try again or type your PIN."; }
}
async function hashPin(pin){
  if(!(window.crypto && crypto.subtle)) return "plain:"+pin;
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("my-money:"+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function acctNames(){ return S.accounts.map(a=>a.name).filter(Boolean); }
function treeSVG(pct){
  const p=Math.max(0,Math.min(100,pct)), done=p>=100;
  const ground='<path d="M0 98 Q75 88 150 98 L150 112 L0 112Z" fill="rgba(255,255,255,.22)"/>';
  if(p<5){ return `<svg class="tree" viewBox="0 0 150 112" aria-hidden="true">${ground}<path d="M75 98 C75 90 75 84 76 78" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M76 82 C65 80 61 72 62 68 C71 68 76 74 76 82Z" fill="#fff" opacity=".95"/><path d="M76 78 C85 74 91 68 92 63 C83 63 77 70 76 78Z" fill="#fff" opacity=".8"/></svg>`; }
  const h=18+p*0.62, top=98-h, r=8+p*0.26;
  const blobs=[[0,0,1],[-.75,.35,.75],[.75,.35,.75],[-.4,-.55,.7],[.45,-.5,.7]].slice(0, p<25?2:p<60?4:5)
    .map(([dx,dy,k])=>`<circle cx="${75+dx*r}" cy="${top+dy*r}" r="${r*k}" fill="#fff" opacity="${.78+k*.2}"/>`).join("");
  const fruit=done?[[-.5,.1],[.4,.3],[.1,-.45],[-.2,.55]].map(([dx,dy])=>`<circle cx="${75+dx*r}" cy="${top+dy*r}" r="${Math.max(3,r*.13)}" fill="#E0607E"/>`).join(""):"";

function billStatus(bill,k){

  const paid=list.reduce((s,e)=>s+(+e.amount||0),0);
  if(paid>0) return {state:"paid",label:"Paid",paid};
  const start=S.startDate||todayStr();
  if(k===ym(start) && bill.day && +bill.day<=+start.slice(8,10)) return {state:"paid",label:"Paid before tracking",paid:0,before:true};
  const today=todayStr(), tk=ym(today);
  if(k<tk) return {state:"late",label:"Not paid",paid:0};
  if(k>tk) return {state:"due",label:"Upcoming",paid:0};
  if(!bill.day) return {state:"due",label:"To pay",paid:0};
  const td=+today.slice(8,10), dd=+bill.day;
  if(td>dd) return {state:"late",label:"Late",paid:0};

}

    String(Math.abs(+e.amount||0)),rs(Math.abs(+e.amount||0)),shortDate(e.date),monthName(ym(e.date))].join(" ").toLowerCase();

async function saveSettings(ev){
  ev.preventDefault();
  const v=id=>{ const el=document.getElementById(id); return el?el.value.trim():""; }, num=id=>{ const n=parseAmount(v(id)); return isFinite(n)?n:0; };
  const N=clone(S), oldNames=S.accounts.map(a=>a.name);
  N.accounts=S.accounts.map((a,i)=>({name:v("acc-n-"+i)||a.name, open:num("acc-o-"+i), corr:num("acc-c-"+i)}));
  const ren={}; oldNames.forEach((o,i)=>{ const n=N.accounts[i].name; if(o && n && o!==n) ren[o]=n; });
  const newNames=N.accounts.map(a=>a.name);
  if(new Set(newNames).size!==newNames.length){ document.getElementById("setErr").textContent="Two accounts have the same name. Give each one its own name."; return; }
  if(v("acc-n-new")) N.accounts.push({name:v("acc-n-new"), open:num("acc-o-new"), corr:0});
  N.startDate=v("startDate")||S.startDate;
  const R=x=>ren[x]||x;
  N.defaults={spent:R(v("d-spent")),received:R(v("d-received")),saveFrom:R(v("d-saveFrom")),saveTo:R(v("g-account"))};
  N.goal={name:v("g-name")||"Goal", price:num("g-price"), already:num("g-already"), target:v("g-target"), account:R(v("g-account"))};
  const billRen={}; S.bills.forEach((b,i)=>{ const n=v("b-n-"+i); if(b.name && n && n!==b.name) billRen[b.name]=n; });
  N.bills=S.bills.map((b,i)=>({name:v("b-n-"+i), amount:num("b-a-"+i), day:parseInt(v("b-d-"+i))||"", cat:v("b-c-"+i), word:v("b-w-"+i)})).filter(b=>b.name);
  const cats=[], limits={};
  S.categories.forEach((c,i)=>{ const n=v("c-n-"+i); if(n){ cats.push(n); const l=num("c-l-"+i); if(l) limits[n]=l; } });
  if(v("c-new")) cats.splice(Math.max(0,cats.length-1),0,v("c-new"));
  if(!cats.includes("Other")) cats.push("Other");
  N.categories=cats; N.limits=limits;
  const pinNew=v("pinNew"), pinOff=document.getElementById("pinOff");
  if(pinNew){ if(!/^\d{4,8}$/.test(pinNew)){ document.getElementById("setErr").textContent="PIN must be 4 to 8 digits"; return; }
    N.pinHash=await hashPin(pinNew); unlocked=N.pinHash; try{sessionStorage.setItem("mm.unlock",unlocked);}catch(e){} }
  else if(pinOff && pinOff.checked){ delete N.pinHash; try{ localStorage.removeItem("mm.faceid"); }catch(e){} }
  const btn=ev.target.querySelector("button[type=submit]"); if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
  try{
    await profileRef.set(N);
    const touched=E.filter(e=>ren[e.from]||ren[e.to]||(e.bill&&billRen[e.bill]));
    for(const e of touched){ const {id,...body}=e; body.from=R(body.from); body.to=R(body.to||""); if(body.bill&&billRen[body.bill]) body.bill=billRen[body.bill]; await entriesCol.doc(id).set(body); }
    S=N; render();
    toast(touched.length?("Settings saved. "+touched.length+" old entr"+(touched.length===1?"y":"ies")+" moved to the new name."):"Settings saved");
  }catch(x){ document.getElementById("setErr").textContent=writeError(x); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="Save settings"; } }
}

  if(t.dataset.vdel!==undefined){ voice.items.splice(+t.dataset.vdel,1); drawVoice(); return; }
  if(t.dataset.vedit!==undefined){ const i=+t.dataset.vedit, e=voice.items[i]; voice.items.splice(i,1); const keep=voice; voice=null;
    sheet={editing:false,id:null,confirmDel:false,e:{type:e.type,date:e.date,amount:String(e.amount),cat:e.cat,cats:e.cat?[e.cat]:[],bill:e.bill||"",src:e.src||"",from:e.from,to:e.to,note:e.note,nofee:true},back:keep}; drawSheet(); return; }
  if(t.id==="vSave"){ saveVoice(); return; }
  if(t.dataset.snap){ restoreSnap(t.dataset.snap); return; }
  if(t.dataset.act){ readSheetInputs(); sheet.e.act=t.dataset.act; drawSheet(); return; }
  if(t.dataset.who!==undefined){ readSheetInputs(); sheet.e.who=t.dataset.who; drawSheet(); return; }
  if(t.dataset.payback!==undefined){ const x=people().find(p=>p.name===t.dataset.payback); if(!x) return;
    sheet={editing:false,id:null,confirmDel:false,e:{type:"People",act:x.net>0?"theyPaid":"iPaid",who:x.name,amount:String(Math.abs(Math.round(x.net*100)/100)),date:todayStr(),from:"",to:"",note:""}}; drawSheet(); return; }
  if(t.dataset.setup){ setupAction(t.dataset.setup); return; }
  if(t.dataset.opencat!==undefined){ openCat = openCat===t.dataset.opencat ? "" : t.dataset.opencat; render(); return; }
  if(t.dataset.bill!==undefined){ readSheetInputs(); sheet.e.bill = sheet.e.bill===t.dataset.bill ? "" : t.dataset.bill; drawSheet(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; try{localStorage.setItem("mm.tab",tab);}catch(e){} window.scrollTo(0,0); render(); return; }
  if(t.dataset.add){ openSheet(t.dataset.add); return; }
  if(t.dataset.pay!==undefined){ const bill=S.bills[+t.dataset.pay]; if(!bill) return;
    const fromAcc = acctNames().includes("Bank") ? "Bank" : (S.defaults.spent||"");
    sheet={editing:false, id:null, confirmDel:false, e:{type:"Spent", date:todayStr(), amount:billAmt(bill)?String(bill.amount):"", cat:bill.cat||"Bills", cats:[bill.cat||"Bills"], bill:bill.name, from:fromAcc, to:"", note:bill.word?(bill.name.toLowerCase().includes(String(bill.word).toLowerCase())?bill.name:bill.word+" "+bill.name):bill.name}};
    drawSheet(); return; }
  if(t.dataset.edit){ const e=E.find(x=>x.id===t.dataset.edit); if(e) openSheet(e.type,e); return; }
  if(t.dataset.mon){ monthKey=addMonths(monthKey,+t.dataset.mon); render(); return; }
  if(t.dataset.k){ readSheetInputs(); sheet.e.type=t.dataset.k; sheet.e.from=""; sheet.e.to=""; sheet.confirmDel=false; drawSheet(); return; }
  if(t.dataset.cat!==undefined){ readSheetInputs(); const L=(sheet.e.cats||[]).slice(), c=t.dataset.cat, i=L.indexOf(c); if(i>=0) L.splice(i,1); else L.push(c); sheet.e.cats=L; sheet.e.cat=L[0]||""; sheet.e.feeTxt=null; if(sheet.e.bill && sheet.e.bill!=="-" && !billsForCat(L).some(b=>b.name===sheet.e.bill)) sheet.e.bill=""; drawSheet(); return; }
  if(t.dataset.from){ readSheetInputs(); sheet.e.from=t.dataset.from; drawSheet(); return; }
  if(t.dataset.to){ readSheetInputs(); sheet.e.to=t.dataset.to; drawSheet(); return; }
  if(t.dataset.delbill!==undefined){ S.bills.splice(+t.dataset.delbill,1); render(); toast("Removed. Tap Save settings to keep it."); return; }
  if(t.dataset.delcat!==undefined){ S.categories.splice(+t.dataset.delcat,1); render(); toast("Removed. Tap Save settings to keep it."); return; }
  if(t.id==="closeSheet"){ const back=sheet&&sheet.back; sheet=null; drawSheet(); if(back){ voice=back; drawVoice(); } return; }
  if(t.id==="saveBtn"){ saveSheet(); return; }
  if(t.id==="delBtn"){ deleteEntry(); return; }
  if(t.id==="addBill"){ S.bills.push({name:"New bill",amount:0,day:"",cat:"Bills",word:""}); render(); return; }
  if(t.id==="dlx"){ downloadExcel(); return; }
  if(t.id==="dlb"){ downloadBackup(); return; }
});
document.addEventListener("submit", async ev=>{
  if(ev.target.id==="setForm") return saveSettings(ev);
  if(ev.target.id==="lockForm"){ ev.preventDefault(); const p=document.getElementById("pinIn").value.trim(); const h=await hashPin(p);
    if(h===S.pinHash){ unlocked=h; try{sessionStorage.setItem("mm.unlock",h);}catch(e){} render(); }
    else { document.getElementById("pinErr").textContent="That PIN isn't right. Try again."; document.getElementById("pinIn").value=""; } }
});
document.addEventListener("toggle", ev=>{ const d=ev.target; if(d && d.dataset && d.dataset.sec){ if(d.open) openSecs.add(d.dataset.sec); else openSecs.delete(d.dataset.sec); } }, true);
async function addBillsFile(f){
  let d=null; try{ d=JSON.parse(await f.text()); }catch(x){}
  const list=d && d.app==="my-money" && d.kind==="bills" && Array.isArray(d.bills) ? d.bills : null;
  if(!list){ toast("That isn't a Kifaya bills file"); return; }
  const N=clone(S), have=new Set(N.bills.map(b=>norm(b.name))); let n=0;
  list.forEach(b=>{ const name=String(b.name||"").trim(); if(!name || have.has(norm(name))) return;
    const cat=S.categories.find(c=>c.toLowerCase()===String(b.cat||"").toLowerCase())||"";
    N.bills.push({name, amount:+b.amount||0, day:parseInt(b.day)||"", cat, word:String(b.word||"")}); have.add(norm(name)); n++; });
  if(!n){ toast("Those bills are already in your list"); return; }
  try{ await profileRef.set(N); S=N; openSecs.add("bills"); render(); toast("Added "+n+" bill"+(n===1?"":"s")+". Check them below."); }
  catch(x){ toast(writeError(x)); }
}
document.addEventListener("input", ev=>{ if(ev.target.id!=="q") return; searchQ=ev.target.value; const q=searchQ.trim(), r=document.getElementById("qres"); if(r) r.innerHTML=q?searchHTML(q):""; });
document.addEventListener("change", ev=>{ if(ev.target.id==="billsf" && ev.target.files && ev.target.files[0]){ addBillsFile(ev.target.files[0]); ev.target.value=""; return; } if(ev.target.id==="rsf" && ev.target.files && ev.target.files[0]){ restoreBackup(ev.target.files[0]); ev.target.value=""; } });
document.addEventListener("input", ev=>{ if(ev.target.id==="amt"){ const e=document.getElementById("amtErr"); if(e) e.textContent=""; } });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && voice){ stopRec(); voice=null; drawVoice(); } if(ev.key==="Escape" && sheet){ sheet=null; drawSheet(); } if(ev.key==="Enter" && sheet && ev.target.tagName==="INPUT"){ ev.preventDefault(); saveSheet(); } if(ev.key==="Enter" && ev.target.id && ev.target.id.startsWith("su-")){ ev.preventDefault(); setupAction(setup.step===3?"finish":"next"); } });

/* ---------- start ---------- */
checkBuild();
render();
(async () => {
  if(!window.claude || !window.claude.use){ render(); return; }
  const [d, u, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  downloads = dl;
  if(!d || !u){ render(); return; }
  uid = await u.id();
  if(!uid){ db=null; render(); return; }
  db = d;
  profileRef = db.doc("data/users/"+uid+"/profile");
  entriesCol = profileRef.collection("entries");
  render();
  profileRef.onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : null; fresh = !snap.exists;
    S = Object.assign(clone(DEFAULTS), data ? clone(data) : {});
    S.defaults = Object.assign(clone(DEFAULTS.defaults), S.defaults||{});
    S.goal = Object.assign(clone(DEFAULTS.goal), S.goal||{});
    S.limits = S.limits||{}; S.bills = S.bills||[]; S.categories = (S.categories&&S.categories.length)?S.categories:clone(DEFAULTS.categories);
    if(data && (data.catAdd||0)<4){ const has=c=>S.categories.some(x=>x.toLowerCase()===c.toLowerCase());
      if(!has("Foodpanda")){ const ei=S.categories.indexOf("Eating Out"); if(ei>=0) S.categories.splice(ei+1,0,"Foodpanda"); else { const oi=S.categories.indexOf("Other"); S.categories.splice(oi<0?S.categories.length:oi,0,"Foodpanda"); } }
      const add=["Online & card payments","Unknown / check later","Untracked money"].filter(c=>!has(c)); const oi=S.categories.indexOf("Other"); S.categories.splice(oi<0?S.categories.length:oi,0,...add); S.catAdd=4; try{ profileRef.set(clone(S)); }catch(x){} }
    ready.profile = true; dailySnap(); if(!document.getElementById("setForm")) render();
  }, ()=>{ ready.profile=true; render(); });
  entriesCol.onSnapshot(qs=>{
    E = qs.docs.map(x=>Object.assign({id:x.id}, x.data()));
    ready.entries = true; dailySnap(); if(!document.getElementById("setForm")) render();
  }, ()=>{ ready.entries=true; render(); });
})();
})();
