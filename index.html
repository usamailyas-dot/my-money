function monthName(k){ const [y,m]=k.split("-").map(Number); return MON[m-1]+" "+y; }

function addMonths(k,n){ let [y,m]=k.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+pad(m); }
function rs(n){ const v=Math.round(n||0); return (v<0?"−":"")+"Rs "+Math.abs(v).toLocaleString("en-IN"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseAmount(t){
  const m=String(t||"").toLowerCase().replace(/rs\.?/g,"").match(/(-?[\d,]*\.?\d+)\s*(k|lac|lacs|lakh|lakhs)?/);
  if(!m) return NaN; let v=parseFloat(m[1].replace(/,/g,"")); if(m[2]==="k") v*=1000; else if(m[2]) v*=100000; return Math.round(v*100)/100;
}
async function hashPin(pin){
  if(!(window.crypto && crypto.subtle)) return "plain:"+pin;
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("my-money:"+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function acctNames(){ return S.accounts.map(a=>a.name).filter(Boolean); }
function lac(n){ return n>=100000 ? (Math.round(n/10000)/10).toString().replace(/\.0$/,"")+" lac" : rs(n); }
const CARDC=[["var(--cob)","#fff"],["var(--mango)","#2A1A00"],["var(--coral)","#fff"],["var(--mint)","#fff"],["var(--pinkc)","#fff"]];
const CATC=["#3346F0","#FFB21E","#9478FA","#1FAF7E","#FF6B57","#F2589C","#22A6D8","#8A6CFF","#E3A000","#5BBF3A"];
function wallet(name){ return name.toLowerCase()==="cash" ? "Wallet" : name; }

/* ---------- money maths ---------- */
function balances(){
  const b={}; S.accounts.forEach(a=>{ if(a.name) b[a.name]=(+a.open||0)+(+a.corr||0); });
  E.forEach(e=>{ if(e.before) return; const a=+e.amount||0;
    if(e.type==="Spent"){ if(e.from in b) b[e.from]-=a; }
    else if(e.type==="Received"){ if(e.from in b) b[e.from]+=a; }
    else if(e.type==="Car" && a<0){ /* taking money out of the fund: the money stays where it is */ }
    else { if(e.from in b) b[e.from]-=a; if(e.to in b) b[e.to]+=a; } });
  return b;
}
function carFund(){ return (+S.goal.already||0)+E.filter(e=>e.type==="Car").reduce((s,e)=>s+(+e.amount||0),0); }
function moneyIHave(b){ const total=Object.values(b).reduce((s,v)=>s+v,0); const g=b[S.goal.account]||0; return total-Math.max(0,Math.min(g,carFund())); }
function inMonth(k){ return E.filter(e=>ym(e.date)===k); }
function sumType(list,t){ return list.filter(e=>e.type===t).reduce((s,e)=>s+(+e.amount||0),0); }
function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function billMatches(bill,e){
  if(e.type!=="Spent") return false;
  if(e.bill) return e.bill===bill.name;                       /* "-" means: not a bill */                       /* picked on the Spent screen or via Mark paid */
  if(bill.cat && e.cat!==bill.cat) return false;
  const note=norm(e.note), keys=[norm(bill.word), norm(bill.name).replace(/ /g,""), ...norm(bill.name).split(" ")].filter(x=>x.length>=3);
  const toks=note.split(" ").filter(x=>x.length>=4);
  if(note && keys.some(k=>note.replace(/ /g,"").includes(k) || toks.some(t=>k.includes(t)))) return true;
  /* only bill in this category: count it when the amount is at least half the bill */
  const sameCat=S.bills.filter(x=>bill.cat && x.cat===bill.cat).length===1;
  return sameCat && (+bill.amount)>0 && (+e.amount||0)>=0.5*(+bill.amount);   /* bills that change need the name or a pick */
}
function billAmt(x){ return +x.amount||0; }
function varies(list){ return list.some(([x])=>!billAmt(x)); }
function catOrder(){
  const since=new Date(Date.now()-90*864e5).toISOString().slice(0,10), cnt={};
  E.forEach(e=>{ if(e.type==="Spent" && e.date>=since) cnt[e.cat]=(cnt[e.cat]||0)+1; });
  return S.categories.slice().sort((a,b)=> ((a==="Other")-(b==="Other")) || ((cnt[b]||0)-(cnt[a]||0)) || (S.categories.indexOf(a)-S.categories.indexOf(b)));
}
function billsForCat(c){ return S.bills.filter(b=>b.name && (!b.cat || b.cat===c)); }
function billStatus(bill,k){
  const list=inMonth(k).filter(e=>billMatches(bill,e));
  const paid=list.reduce((s,e)=>s+(+e.amount||0),0);
  if(paid>0) return {state:"paid",label:"Paid",paid};
  const start=S.startDate||todayStr();
  if(k===ym(start) && bill.day && +bill.day<=+start.slice(8,10)) return {state:"paid",label:"Paid before tracking",paid:0,before:true};
  const today=todayStr(), tk=ym(today);
  if(k<tk) return {state:"late",label:"Not paid",paid:0};
  if(k>tk) return {state:"due",label:"Upcoming",paid:0};
  if(!bill.day) return {state:"due",label:"To pay",paid:0};
  const td=+today.slice(8,10), dd=+bill.day;
  if(td>dd) return {state:"late",label:"Late",paid:0};
  if(td===dd) return {state:"late",label:"Due today",paid:0};
  return {state:"due",label:"Due in "+(dd-td)+" day"+(dd-td===1?"":"s"),paid:0};
}
function monthsBetween(a,b){ const [y1,m1,d1]=a.split("-").map(Number), [y2,m2,d2]=b.split("-").map(Number); let n=(y2-y1)*12+(m2-m1); if(d2<d1) n--; return n; }

function entryRow(e){
  const cls={Spent:"c-out",Received:"c-in",Moved:"c-mv",Car:"c-car"}[e.type];
  const dot={Spent:["d-out","−"],Received:["d-in","+"],Moved:["d-mv","⇄"],Car:["d-car","★"]}[e.type];
  const what = e.type==="Spent" ? (e.cat||"Other") : e.type==="Received" ? (e.note||"Money in") : e.type==="Moved" ? "Moved" : "Saved for "+(S.goal.name||"goal").toLowerCase();
  const sub = [shortDate(e.date),
    e.type==="Spent" ? "from "+wallet(e.from||"") : e.type==="Received" ? "into "+wallet(e.from||"") : wallet(e.from||"")+" → "+wallet(e.to||""),
    (e.type!=="Received" && e.note) ? e.note : ""].filter(Boolean).join(" · ");
  const sign = e.type==="Spent"?"−":e.type==="Received"?"+":"";
  return `<button class="item" data-edit="${esc(e.id)}"><span class="dot ${dot[0]}" aria-hidden="true">${dot[1]}</span><span class="txt"><span class="t1">${esc(what)}</span><span class="t2">${esc(sub)}</span></span><span class="amt num ${cls}">${sign}${rs(e.amount).replace("−","")}</span></button>`;
}

async function setupAction(a){
  readSetup(); const err=document.getElementById("suErr"), n=k=>{ const x=parseAmount(setup[k]); return isFinite(x)?x:0; };
  if(a==="back"){ setup.step=Math.max(0,setup.step-1); render(); return; }
  if(a==="next"){
    if(setup.step===1 && ["bank","cash"].some(k=>setup[k] && !isFinite(parseAmount(setup[k])))){ err.textContent="Type numbers only, like 25000 or 1.5 lac"; return; }
    if(setup.step===2 && ["gprice","gsaved"].some(k=>setup[k] && !isFinite(parseAmount(setup[k])))){ err.textContent="Type numbers only, like 30 lac"; return; }
    setup.step++; render(); setTimeout(()=>{ const f=document.querySelector(".setup input"); if(f) f.focus(); },60); return; }
  if(setup.pin && !/^\d{4,8}$/.test(setup.pin)){ err.textContent="The PIN must be 4 to 8 numbers, or leave it empty"; return; }
  let place=(setup.gplace||"Savings").trim(); if(["bank","cash","wallet"].includes(place.toLowerCase())) place="Savings";
  const saved=n("gsaved");
  const P=clone(DEFAULTS);
  P.startDate=todayStr();
  P.accounts=[{name:"Bank",open:n("bank"),corr:0},{name:"Cash",open:n("cash"),corr:0},{name:place,open:saved,corr:0}];
  P.goal={name:setup.gname||"Savings", price:n("gprice"), already:saved, target:"", account:place};
  P.defaults={spent:"Bank", received:"Bank", saveFrom:"Bank", saveTo:place};
  if(setup.pin){ P.pinHash=await hashPin(setup.pin); unlocked=P.pinHash; try{sessionStorage.setItem("mm.unlock",unlocked);}catch(e){} }
  try{ await profileRef.set(P); setup={step:0}; tab="home"; toast("All set. Tap + to add your first entry."); }
  catch(x){ err.textContent=writeError(x); }
}

async function downloadBackup(){
  if(!downloads){ toast("Downloads aren't available here."); return; }
  const data=JSON.stringify({app:"my-money", v:1, exported:new Date().toISOString(), profile:S, entries:E}, null, 1);
  try{ const r=await downloads.save({filename:"My Money backup "+todayStr()+".json", data:new Blob([data],{type:"application/json"})});
    if(!r || r.status!=="declined"){ try{ localStorage.setItem("mm.lastBackup", todayStr()); }catch(e){} if(tab==="settings") render(); toast("Backup saved: "+E.length+" entries"); } }
  catch(x){ if(x&&x.code!=="declined") toast("Couldn't save the backup here."); }
}
async function restoreBackup(file){
  let o=null; try{ o=JSON.parse(await file.text()); }catch(e){}
  if(!o || o.app!=="my-money" || !o.profile || !Array.isArray(o.entries)){ toast("That isn't a My Money backup file."); return; }
  if(!confirm("Replace everything in this app with the backup from "+String(o.exported||"").slice(0,10)+"? ("+o.entries.length+" entries)")) return;
  try{ await window.__restore(o); unlocked=o.profile.pinHash||""; try{sessionStorage.setItem("mm.unlock",unlocked);}catch(e){} toast("Restored "+o.entries.length+" entries"); setTimeout(render,60); }
  catch(x){ toast(writeError(x)); }
}

function openSheet(kind, entry){

  host.innerHTML=`<div class="sheet" id="sheetBg"><div class="panel" role="dialog" aria-modal="true" aria-label="${sheet.editing?"Change entry":"Add entry"}">
    <div class="row"><h2>${sheet.editing?"Change entry":"Add"}</h2><button class="linkbtn" id="closeSheet">Close</button></div>
    <div class="seg" role="group" aria-label="What happened">${["Spent","Received","Moved","Car"].map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===t}">${k==="Car"?esc(S.goal.name||"Goal"):k}</button>`).join("")}</div>

    ${t==="Spent"?`<div class="field"><span class="flab">Category</span><div class="chips" id="catChips">${catOrder().map(c=>`<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c===(e.cat||"")}">${esc(c)}</button>`).join("")}</div></div>`:""}
    ${t==="Spent" && e.cat && billsForCat(e.cat).length?`<div class="field"><span class="flab">Which bill is this? (optional)</span><div class="chips">${billsForCat(e.cat).map(b=>`<button type="button" class="chip" data-bill="${esc(b.name)}" aria-pressed="${e.bill===b.name}">${esc(b.name)}</button>`).join("")}<button type="button" class="chip" data-bill="-" aria-pressed="${e.bill==="-"}">Not a bill</button></div></div>`:""}
    <div class="field"><span class="flab">${fromLabel}</span><div class="chips">${names.filter(n=>t==="Car"?n!==S.goal.account:true).map(n=>`<button type="button" class="chip" data-from="${esc(n)}" aria-pressed="${n===curFrom}">${esc(wallet(n))}</button>`).join("")}</div></div>
    ${t==="Moved"||t==="Car"?`<div class="field"><span class="flab">To</span><div class="chips">${names.map(n=>`<button type="button" class="chip" data-to="${esc(n)}" aria-pressed="${n===curTo}">${esc(wallet(n))}</button>`).join("")}</div></div>`:""}
    <div class="field"><label for="note">${t==="Received"?"From who / what":"Note (optional)"}</label><input id="note" autocomplete="off" placeholder="${t==="Received"?"Mark, logo project":t==="Spent"?"electricity":"atm"}" value="${esc(e.note)}"></div>
    <div class="field"><label for="date">Date</label><input type="date" id="date" value="${esc(e.date)}"></div>
    <button class="primary" id="saveBtn">${sheet.editing?"Save changes":"Save"}</button>
    ${sheet.editing?`<button class="ghost danger" id="delBtn">${sheet.confirmDel?"Tap again to delete":"Delete entry"}</button>`:""}
  </div></div>`;
  if(!sheet.editing) setTimeout(()=>{ const a=document.getElementById("amt"); if(a && !a.value) a.focus(); },60);
}
function readSheetInputs(){ if(!sheet) return; const a=document.getElementById("amt"), n=document.getElementById("note"), d=document.getElementById("date");
  if(a) sheet.e.amount=a.value; if(n) sheet.e.note=n.value; if(d) sheet.e.date=d.value||todayStr(); }
async function saveSheet(){
  readSheetInputs(); const e=sheet.e, t=e.type, err=document.getElementById("amtErr");
  const amt=parseAmount(e.amount);
  if(!isFinite(amt) || amt===0 || (t!=="Car" && amt<0)){ err.textContent="Type the amount, like 500 or 2k"; return; }
  const from = e.from || ({Spent:S.defaults.spent,Received:S.defaults.received,Car:S.defaults.saveFrom}[t]||"");
  const to = t==="Car" ? (e.to||S.goal.account) : t==="Moved" ? e.to : "";
  if(t==="Moved" && (!from||!to)){ err.textContent="Pick both From and To"; return; }
  if((t==="Moved"||(t==="Car" && amt>0)) && from===to){ err.textContent="From and To can't be the same account"; return; }
  const doc={type:t, amount:amt, date:e.date||todayStr(), cat:t==="Spent"?(e.cat||"Other"):"", bill:t==="Spent"?(e.bill||""):"", from, to:to||"", note:String(e.note||"").trim(),
    before: !!(sheet.editing && e.before), created: sheet.editing ? (e.created||Date.now()) : Date.now()};
  const btn=document.getElementById("saveBtn"); btn.disabled=true; btn.textContent="Saving…";
  try{
    if(sheet.editing) await entriesCol.doc(sheet.id).set(doc); else await entriesCol.doc().set(doc);
    const msg=(sheet.editing?"Changed: ":"Saved: ")+(t==="Car"?"saved for "+(S.goal.name||"goal").toLowerCase():t.toLowerCase())+" "+rs(amt);
    sheet=null; drawSheet(); toast(msg);
  }catch(x){ btn.disabled=false; btn.textContent="Save"; err.textContent=writeError(x); }
}
async function deleteEntry(){
  if(!sheet.confirmDel){ sheet.confirmDel=true; readSheetInputs(); drawSheet(); return; }
  try{ await entriesCol.doc(sheet.id).delete(); sheet=null; drawSheet(); toast("Deleted"); }
  catch(x){ document.getElementById("amtErr").textContent=writeError(x); }
}
function writeError(x){ const c=x&&x.code; if(c==="quota_exceeded") return "Storage is full. Download Excel and remove old entries."; if(c==="invalid_argument") return "You can only view this page, not change it."; return "Couldn't save. Check your internet and try again."; }

/* ---------- settings save ---------- */
async function saveSettings(ev){
  ev.preventDefault();
  const v=id=>{ const el=document.getElementById(id); return el?el.value.trim():""; }, num=id=>{ const n=parseAmount(v(id)); return isFinite(n)?n:0; };
  const N=clone(S), oldNames=S.accounts.map(a=>a.name);
  N.accounts=S.accounts.map((a,i)=>({name:v("acc-n-"+i)||a.name, open:num("acc-o-"+i), corr:num("acc-c-"+i)}));
  const ren={}; oldNames.forEach((o,i)=>{ const n=N.accounts[i].name; if(o && n && o!==n) ren[o]=n; });
  const newNames=N.accounts.map(a=>a.name);
  if(new Set(newNames).size!==newNames.length){ document.getElementById("setErr").textContent="Two accounts have the same name. Give each one its own name."; return; }
  if(v("acc-n-new")) N.accounts.push({name:v("acc-n-new"), open:num("acc-o-new"), corr:0});
  N.startDate=v("startDate")||S.startDate;
  const R=x=>ren[x]||x;
  N.defaults={spent:R(v("d-spent")),received:R(v("d-received")),saveFrom:R(v("d-saveFrom")),saveTo:R(v("g-account"))};
  N.goal={name:v("g-name")||"Goal", price:num("g-price"), already:num("g-already"), target:v("g-target"), account:R(v("g-account"))};
  const billRen={}; S.bills.forEach((b,i)=>{ const n=v("b-n-"+i); if(b.name && n && n!==b.name) billRen[b.name]=n; });
  N.bills=S.bills.map((b,i)=>({name:v("b-n-"+i), amount:num("b-a-"+i), day:parseInt(v("b-d-"+i))||"", cat:v("b-c-"+i), word:v("b-w-"+i)})).filter(b=>b.name);
  const cats=[], limits={};
  S.categories.forEach((c,i)=>{ const n=v("c-n-"+i); if(n){ cats.push(n); const l=num("c-l-"+i); if(l) limits[n]=l; } });
  if(v("c-new")) cats.splice(Math.max(0,cats.length-1),0,v("c-new"));
  if(!cats.includes("Other")) cats.push("Other");
  N.categories=cats; N.limits=limits;
  const pinNew=v("pinNew"), pinOff=document.getElementById("pinOff");
  if(pinNew){ if(!/^\d{4,8}$/.test(pinNew)){ document.getElementById("setErr").textContent="PIN must be 4 to 8 digits"; return; }
    N.pinHash=await hashPin(pinNew); unlocked=N.pinHash; try{sessionStorage.setItem("mm.unlock",unlocked);}catch(e){} }
  else if(pinOff && pinOff.checked){ delete N.pinHash; }
  const btn=ev.target.querySelector("button[type=submit]"); if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
  try{
    await profileRef.set(N);
    const touched=E.filter(e=>ren[e.from]||ren[e.to]||(e.bill&&billRen[e.bill]));
    for(const e of touched){ const {id,...body}=e; body.from=R(body.from); body.to=R(body.to||""); if(body.bill&&billRen[body.bill]) body.bill=billRen[body.bill]; await entriesCol.doc(id).set(body); }
    S=N; render();
    toast(touched.length?("Settings saved. "+touched.length+" old entr"+(touched.length===1?"y":"ies")+" moved to the new name."):"Settings saved");
  }catch(x){ document.getElementById("setErr").textContent=writeError(x); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="Save settings"; } }
}

async function downloadExcel(){
  if(!window.XLSX){ toast("Getting the Excel file ready…");
    try{ await new Promise((ok,no)=>{ const sc=document.createElement("script"); sc.src="xlsx.full.min.js"; sc.onload=ok; sc.onerror=no; document.head.appendChild(sc); }); }
    catch(x){ toast("Excel tool didn't load. Check your internet."); return; } }
  if(!downloads){ toast("Downloads aren't available here."); return; }
  const wb=XLSX.utils.book_new();
  const rows=sorted(E).reverse().map(e=>({Date:e.date, "What happened":e.type==="Car"?"Saved for "+(S.goal.name||"goal").toLowerCase():e.type, Amount:+e.amount, Category:e.cat||"", From:e.from||"", To:e.to||"", Note:e.note||"", Bill:e.bill&&e.bill!=="-"?e.bill:"", "Before tracking":e.before?"Yes":""}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Entries");
  const months=[...new Set(E.map(e=>ym(e.date)))].sort().map(k=>{ const m=inMonth(k); const i=sumType(m,"Received"), o=sumType(m,"Spent"), s=sumType(m,"Car"); return {Month:monthName(k), "Money in":i, "Money out":o, "Saved for goal":s, "In - out - saved":i-o-s}; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(months), "Months");
  const b=balances(); const bal=Object.entries(b).map(([n,v])=>({Account:n, Balance:Math.round(v)}));
  bal.push({Account:"Money I have", Balance:Math.round(moneyIHave(b))}, {Account:(S.goal.name||"Goal")+" fund", Balance:Math.round(carFund())});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bal), "Balances");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{ await downloads.save({filename:"My Money "+todayStr()+".xlsx", data:new Blob([buf])}); }
  catch(x){ if(x&&x.code!=="declined") toast("Couldn't download the file here."); }
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(t){ const h=document.getElementById("toastHost"); h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{h.innerHTML="";},2600); }

/* ---------- events ---------- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-setup],[data-opencat],[data-bill],[data-tab],[data-add],[data-pay],[data-edit],[data-mon],[data-k],[data-cat],[data-from],[data-to],[data-delbill],[data-delcat],#closeSheet,#saveBtn,#delBtn,#addBill,#dlx,#dlb,#sheetBg");
  if(!t) return;
  if(t.id==="sheetBg"){ if(ev.target===t){ sheet=null; drawSheet(); } return; }
  if(t.dataset.setup){ setupAction(t.dataset.setup); return; }
  if(t.dataset.opencat!==undefined){ openCat = openCat===t.dataset.opencat ? "" : t.dataset.opencat; render(); return; }
  if(t.dataset.bill!==undefined){ readSheetInputs(); sheet.e.bill = sheet.e.bill===t.dataset.bill ? "" : t.dataset.bill; drawSheet(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; try{localStorage.setItem("mm.tab",tab);}catch(e){} window.scrollTo(0,0); render(); return; }
  if(t.dataset.add){ openSheet(t.dataset.add); return; }
  if(t.dataset.pay!==undefined){ const bill=S.bills[+t.dataset.pay]; if(!bill) return;
    const fromAcc = acctNames().includes("Bank") ? "Bank" : (S.defaults.spent||"");
    sheet={editing:false, id:null, confirmDel:false, e:{type:"Spent", date:todayStr(), amount:billAmt(bill)?String(bill.amount):"", cat:bill.cat||"Bills", bill:bill.name, from:fromAcc, to:"", note:bill.word?(bill.name.toLowerCase().includes(String(bill.word).toLowerCase())?bill.name:bill.word+" "+bill.name):bill.name}};
    drawSheet(); return; }
  if(t.dataset.edit){ const e=E.find(x=>x.id===t.dataset.edit); if(e) openSheet(e.type,e); return; }
  if(t.dataset.mon){ monthKey=addMonths(monthKey,+t.dataset.mon); render(); return; }
  if(t.dataset.k){ readSheetInputs(); sheet.e.type=t.dataset.k; sheet.e.from=""; sheet.e.to=""; sheet.confirmDel=false; drawSheet(); return; }
  if(t.dataset.cat!==undefined){ readSheetInputs(); sheet.e.cat=t.dataset.cat; if(sheet.e.bill && sheet.e.bill!=="-" && !billsForCat(sheet.e.cat).some(b=>b.name===sheet.e.bill)) sheet.e.bill=""; drawSheet(); return; }
  if(t.dataset.from){ readSheetInputs(); sheet.e.from=t.dataset.from; drawSheet(); return; }
  if(t.dataset.to){ readSheetInputs(); sheet.e.to=t.dataset.to; drawSheet(); return; }
  if(t.dataset.delbill!==undefined){ S.bills.splice(+t.dataset.delbill,1); render(); toast("Removed. Tap Save settings to keep it."); return; }
  if(t.dataset.delcat!==undefined){ S.categories.splice(+t.dataset.delcat,1); render(); toast("Removed. Tap Save settings to keep it."); return; }
  if(t.id==="closeSheet"){ sheet=null; drawSheet(); return; }
  if(t.id==="saveBtn"){ saveSheet(); return; }
  if(t.id==="delBtn"){ deleteEntry(); return; }
  if(t.id==="addBill"){ S.bills.push({name:"New bill",amount:0,day:"",cat:"Bills",word:""}); render(); return; }
  if(t.id==="dlx"){ downloadExcel(); return; }
  if(t.id==="dlb"){ downloadBackup(); return; }
});
document.addEventListener("submit", async ev=>{
  if(ev.target.id==="setForm") return saveSettings(ev);
  if(ev.target.id==="lockForm"){ ev.preventDefault(); const p=document.getElementById("pinIn").value.trim(); const h=await hashPin(p);
    if(h===S.pinHash){ unlocked=h; try{sessionStorage.setItem("mm.unlock",h);}catch(e){} render(); }
    else { document.getElementById("pinErr").textContent="That PIN isn't right. Try again."; document.getElementById("pinIn").value=""; } }
});
document.addEventListener("toggle", ev=>{ const d=ev.target; if(d && d.dataset && d.dataset.sec){ if(d.open) openSecs.add(d.dataset.sec); else openSecs.delete(d.dataset.sec); } }, true);
document.addEventListener("change", ev=>{ if(ev.target.id==="rsf" && ev.target.files && ev.target.files[0]){ restoreBackup(ev.target.files[0]); ev.target.value=""; } });
document.addEventListener("input", ev=>{ if(ev.target.id==="amt"){ const e=document.getElementById("amtErr"); if(e) e.textContent=""; } });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && sheet){ sheet=null; drawSheet(); } if(ev.key==="Enter" && sheet && ev.target.tagName==="INPUT"){ ev.preventDefault(); saveSheet(); } if(ev.key==="Enter" && ev.target.id && ev.target.id.startsWith("su-")){ ev.preventDefault(); setupAction(setup.step===3?"finish":"next"); } });

/* ---------- start ---------- */
checkBuild();
render();
(async () => {
  if(!window.claude || !window.claude.use){ render(); return; }
  const [d, u, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  downloads = dl;
  if(!d || !u){ render(); return; }
  uid = await u.id();
  if(!uid){ db=null; render(); return; }
  db = d;
  profileRef = db.doc("data/users/"+uid+"/profile");
  entriesCol = profileRef.collection("entries");
  render();
  profileRef.onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : null; fresh = !snap.exists;
    S = Object.assign(clone(DEFAULTS), data ? clone(data) : {});
    S.defaults = Object.assign(clone(DEFAULTS.defaults), S.defaults||{});
    S.goal = Object.assign(clone(DEFAULTS.goal), S.goal||{});
    S.limits = S.limits||{}; S.bills = S.bills||[]; S.categories = (S.categories&&S.categories.length)?S.categories:clone(DEFAULTS.categories);
    ready.profile = true; if(!document.getElementById("setForm")) render();
  }, ()=>{ ready.profile=true; render(); });
  entriesCol.onSnapshot(qs=>{
    E = qs.docs.map(x=>Object.assign({id:x.id}, x.data()));
    ready.entries = true; if(!document.getElementById("setForm")) render();
  }, ()=>{ ready.entries=true; render(); });
})();
})();
</script>
